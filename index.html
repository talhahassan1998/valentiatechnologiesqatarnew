<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The V mark, not the full lockup: the wordmark is illegible at 16px.
         %BASE_URL% is substituted by Vite at build time -- a bare "/..." here
         404s under the GitHub Pages subdirectory, and unlike JSX this file
         cannot reach src/lib/asset.ts. -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8fd" />
    <title>Valentia Technologies | Engineering Better Healthcare</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
    <script>
      // Applied before first paint — React mounting later would flash the
      // wrong ground. Light is the default; dark only when chosen via the
      // toggle. Mirrors readTheme() in lib/theme.ts.
      ;(function () {
        var t = 'light'
        try {
          if (localStorage.getItem('valentia-theme-choice') === 'dark') t = 'dark'
        } catch (e) {}
        if (t === 'light') document.documentElement.setAttribute('data-theme', 'light')
        document.documentElement.style.colorScheme = t
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
